name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels that PR's older, unfinished runs, so
# superseded commits don't hold the few macOS runners. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install Hatch
        run: python -m pip install hatch
      - name: Lint
        run: hatch run lint
      - name: Test
        run: hatch run test

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install hatch
      - run: hatch build
      - run: hatch run dist-check

  byteplan:
    # Unfinished work is tracked with BytePlan: this checks that the commit's TODO/FIXME
    # annotations and .byteplan/tasks.json agree. Read-only; it never changes the code.
    name: BytePlan task registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "byteplan==0.2.0"
      - run: byteplan check --commit HEAD
